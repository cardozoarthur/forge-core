name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_epoch: ${{ steps.identity.outputs.release_epoch }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Pin immutable release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag is not a supported semantic version: $RELEASE_TAG" >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
            echo "Releases must run from refs/tags/$RELEASE_TAG; got $GITHUB_REF." >&2
            echo "For workflow_dispatch, select the same tag in 'Use workflow from'." >&2
            exit 1
          }

          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$GITHUB_SHA" = "$release_sha" || {
            echo "GitHub event SHA $GITHUB_SHA does not match tag commit $release_sha." >&2
            exit 1
          }

          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "forge-core") | .version')"
          test "$RELEASE_TAG" = "v${crate_version}"
          git verify-tag "$RELEASE_TAG" 2>/dev/null || git rev-parse --verify "refs/tags/$RELEASE_TAG"
          release_epoch="$(git show -s --format=%ct "$release_sha")"
          printf 'release_sha=%s\n' "$release_sha" >>"$GITHUB_OUTPUT"
          printf 'release_epoch=%s\n' "$release_epoch" >>"$GITHUB_OUTPUT"

      - name: Install pinned security tools
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" |
            sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan tagged source and history for secrets
        run: |
          # Run before tests and smokes create ignored runtime keys under .forge/.
          gitleaks dir --redact=100 --no-banner --no-color .
          gitleaks git --redact=100 --no-banner --no-color --log-opts="--all" .

      - name: Run release gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked
          cargo build --release --all-features --locked
          bash packaging/smoke-production.sh target/release/forge
          bash packaging/smoke-offhost-backup.sh target/release/forge
          cargo audit
          cargo deny check advisories licenses bans sources

      - name: Verify distributable crate and complete skill bundle
        shell: bash
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verification_dir"' EXIT
          package_list="$verification_dir/package-list"
          expected="$verification_dir/expected"
          actual="$verification_dir/actual"

          cargo package --list --locked >"$package_list"

          printf '%s\n' \
            .agents/skills/forge-core/SKILL.md \
            .agents/skills/forge-core-addons-ui/SKILL.md \
            .agents/skills/forge-core-agent/SKILL.md \
            .agents/skills/forge-core-artifacts/SKILL.md \
            .agents/skills/forge-core-context/SKILL.md \
            .agents/skills/forge-core-documentation/SKILL.md \
            .agents/skills/forge-core-executors/SKILL.md \
            .agents/skills/forge-core-missions/SKILL.md \
            .agents/skills/forge-core-runtime/SKILL.md \
            .agents/skills/forge-core-workflow/SKILL.md \
            .agents/skills/forge-core-workspaces/SKILL.md |
            LC_ALL=C sort >"$expected"
          grep -E '^\.agents/skills/[^/]+/SKILL\.md$' "$package_list" |
            LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"

          for directory in installer packaging src tests; do
            find "$directory" -type f -print | LC_ALL=C sort >"$expected"
            grep -E "^${directory}/" "$package_list" | LC_ALL=C sort >"$actual"
            diff -u "$expected" "$actual"
          done

          grep -Fx 'docs/production-single-host.md' "$package_list" >/dev/null
          grep -Fx 'skills/forge-core/SKILL.md' "$package_list" >/dev/null
          cargo package --locked

      - name: Prove bounded mission-platform inventory 40/40
        run: |
          # This is a fast deterministic contract smoke. It must remain
          # production_ready=false and is not deployment evidence.
          cargo test --all-features --locked \
            --test forge_mission_platform_contract \
            registered_worktree_binding_receipt_allows_the_bounded_probe_to_pass \
            -- --exact

      - name: Prove operational mission execute-submit-resume lifecycle
        run: |
          # This exercises real local command execution and persisted receipts.
          # It is a pre-publish runtime gate, not the post-installation
          # production-readiness manifest.
          cargo test --all-features --locked \
            --test forge_mission_execution_cli_e2e \
            cli_execution_receipts_cover_nonzero_timeout_replay_submit_and_reopen \
            -- --exact

      - name: Verify canonical 1-40 inventory is bound to production governance
        shell: bash
        run: |
          catalog_file="$(mktemp)"
          plan_file="$(mktemp)"
          trap 'rm -f -- "$catalog_file" "$plan_file"' EXIT

          target/release/forge squad capabilities --output json >"$catalog_file"
          target/release/forge milestone production-plan \
            --version 0.5 \
            --output json >"$plan_file"

          jq -e '
            .capability_count == 40
            and .production_ready == false
            and (.inventory_sha256 | test("^[0-9a-f]{64}$"))
            and ([.capabilities[].number] == [range(1; 41)])
          ' "$catalog_file" >/dev/null
          jq -e '
            .capability_inventory_count == 40
            and .production_ready == false
            and .required_gate_count == 11
            and .required_receipt_count == 14
            and ([.requirements[].gate_id]
              | index("mission_operational_lifecycle") != null)
          ' "$plan_file" >/dev/null
          test \
            "$(jq -r '.inventory_sha256' "$catalog_file")" = \
            "$(jq -r '.capability_inventory_sha256' "$plan_file")"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.release_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: forge-linux-x86_64.tar.gz
            binary: forge
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: forge-linux-aarch64.tar.gz
            binary: forge
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: forge-macos-x86_64.tar.gz
            binary: forge
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: forge-macos-aarch64.tar.gz
            binary: forge
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: forge-windows-x86_64.zip
            binary: forge.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Verify pinned source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/stage/packaging dist/stage/docs dist/stage/installer
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/stage/forge
          install -m 0644 LICENSE dist/stage/LICENSE
          cp -a packaging/systemd dist/stage/packaging/systemd
          chmod 0755 \
            dist/stage/packaging/systemd/forge-admin \
            dist/stage/packaging/systemd/forge-backup \
            dist/stage/packaging/systemd/forge-restore-drill \
            dist/stage/packaging/systemd/install-service.sh
          chmod 0644 \
            dist/stage/packaging/systemd/forge-ops.service \
            dist/stage/packaging/systemd/forge-backup.service \
            dist/stage/packaging/systemd/forge-backup.timer
          install -m 0644 docs/production-single-host.md dist/stage/docs/production-single-host.md
          install -m 0644 installer/README.md dist/stage/installer/README.md
          python3 packaging/reproducible_archive.py create \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}" \
            forge \
            LICENSE \
            packaging/systemd \
            docs/production-single-host.md \
            installer/README.md

      - name: Validate Linux archive layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 packaging/reproducible_archive.py verify \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}" \
            forge \
            LICENSE \
            packaging/systemd \
            docs/production-single-host.md \
            installer/README.md

          python3 packaging/reproducible_archive.py create \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}.reproduced" \
            forge \
            LICENSE \
            packaging/systemd \
            docs/production-single-host.md \
            installer/README.md
          cmp "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.reproduced"
          rm "dist/${{ matrix.asset }}.reproduced"

          validation_dir="$(mktemp -d)"
          trap 'rm -rf -- "$validation_dir"' EXIT
          mkdir "$validation_dir/archive"
          tar -xzf "dist/${{ matrix.asset }}" -C "$validation_dir/archive"

          {
            printf '%s\n' \
              forge \
              LICENSE \
              docs/production-single-host.md \
              installer/README.md
            find packaging/systemd -type f -print
          } | LC_ALL=C sort >"$validation_dir/expected"
          (
            cd "$validation_dir/archive"
            find . -type f -print
          ) | sed 's#^\./##' | LC_ALL=C sort >"$validation_dir/actual"
          diff -u "$validation_dir/expected" "$validation_dir/actual"

          for executable in \
            forge \
            packaging/systemd/forge-admin \
            packaging/systemd/forge-backup \
            packaging/systemd/forge-restore-drill \
            packaging/systemd/install-service.sh
          do
            test "$(stat -c '%a' "$validation_dir/archive/$executable")" = 755
          done

          for non_executable in \
            LICENSE \
            docs/production-single-host.md \
            installer/README.md \
            packaging/systemd/forge-ops.service \
            packaging/systemd/forge-backup.service \
            packaging/systemd/forge-backup.timer
          do
            test "$(stat -c '%a' "$validation_dir/archive/$non_executable")" = 644
          done

          expected_version="forge ${RELEASE_TAG#v}"
          test "$("$validation_dir/archive/forge" --version)" = "$expected_version"
          kernel_version="$(uname -r | cut -d- -f1)"
          dpkg --compare-versions "$kernel_version" ge 4.18
          systemd_version="$(systemd --version | awk 'NR == 1 { print $2 }')"
          dpkg --compare-versions "$systemd_version" ge 249
          required_glibc="$(
            readelf --version-info "$validation_dir/archive/forge" |
              grep -Eo 'GLIBC_[0-9]+(\.[0-9]+)+' |
              sort -Vu |
              tail -1
          )"
          if [[ -z "$required_glibc" ]] ||
            ! dpkg --compare-versions "${required_glibc#GLIBC_}" le 2.34
          then
            echo "Linux release requires unsupported $required_glibc; maximum is GLIBC_2.34." >&2
            exit 1
          fi

      - name: Exercise Unix installer against release fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf -- "$smoke_dir"
          }
          trap cleanup EXIT

          mkdir "$smoke_dir/release"
          cp "dist/${{ matrix.asset }}" "$smoke_dir/release/"
          digest="$(sha256sum "dist/${{ matrix.asset }}" | awk '{ print $1 }')"
          printf '%s  %s\n' "$digest" "${{ matrix.asset }}" \
            >"$smoke_dir/release/SHA256SUMS"
          port="$(
            python3 - <<'PY'
          import socket

          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              print(probe.getsockname()[1])
          PY
          )"
          python3 -m http.server "$port" \
            --bind 127.0.0.1 \
            --directory "$smoke_dir/release" \
            >"$smoke_dir/http.log" 2>&1 &
          server_pid="$!"

          base_url="http://127.0.0.1:$port"
          for _ in {1..40}; do
            if curl -fsS "$base_url/SHA256SUMS" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS "$base_url/SHA256SUMS" >/dev/null

          FORGE_RELEASE_BASE_URL="$base_url" \
            FORGE_BIN_DIR="$smoke_dir/bin" \
            bash installer/install.sh
          test "$("$smoke_dir/bin/forge" --version)" = "forge ${RELEASE_TAG#v}"

      - name: Package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/stage
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/stage/forge
          install -m 0644 LICENSE dist/stage/LICENSE
          python3 packaging/reproducible_archive.py create \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}" \
            forge \
            LICENSE

      - name: Validate macOS archive layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 packaging/reproducible_archive.py verify \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}" \
            forge \
            LICENSE
          python3 packaging/reproducible_archive.py create \
            --format tar.gz \
            --source dist/stage \
            --output "dist/${{ matrix.asset }}.reproduced" \
            forge \
            LICENSE
          cmp "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.reproduced"
          rm "dist/${{ matrix.asset }}.reproduced"

          validation_dir="$(mktemp -d)"
          trap 'rm -rf -- "$validation_dir"' EXIT
          mkdir "$validation_dir/archive"
          tar -xzf "dist/${{ matrix.asset }}" -C "$validation_dir/archive"

          printf '%s\n' forge LICENSE | LC_ALL=C sort >"$validation_dir/expected"
          (
            cd "$validation_dir/archive"
            find . -type f -print
          ) | sed 's#^\./##' | LC_ALL=C sort >"$validation_dir/actual"
          diff -u "$validation_dir/expected" "$validation_dir/actual"
          test -x "$validation_dir/archive/forge"
          test "$("$validation_dir/archive/forge" --version)" = "forge ${RELEASE_TAG#v}"

      - name: Exercise Unix installer against release fixture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf -- "$smoke_dir"
          }
          trap cleanup EXIT

          mkdir "$smoke_dir/release"
          cp "dist/${{ matrix.asset }}" "$smoke_dir/release/"
          digest="$(shasum -a 256 "dist/${{ matrix.asset }}" | awk '{ print $1 }')"
          printf '%s  %s\n' "$digest" "${{ matrix.asset }}" \
            >"$smoke_dir/release/SHA256SUMS"
          port="$(
            python3 - <<'PY'
          import socket

          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              print(probe.getsockname()[1])
          PY
          )"
          python3 -m http.server "$port" \
            --bind 127.0.0.1 \
            --directory "$smoke_dir/release" \
            >"$smoke_dir/http.log" 2>&1 &
          server_pid="$!"

          base_url="http://127.0.0.1:$port"
          for _ in {1..40}; do
            if curl -fsS "$base_url/SHA256SUMS" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS "$base_url/SHA256SUMS" >/dev/null

          FORGE_RELEASE_BASE_URL="$base_url" \
            FORGE_BIN_DIR="$smoke_dir/bin" \
            bash installer/install.sh
          test "$("$smoke_dir/bin/forge" --version)" = "forge ${RELEASE_TAG#v}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/stage/forge.exe
          Copy-Item LICENSE dist/stage/LICENSE
          python packaging/reproducible_archive.py create `
            --format zip `
            --source dist/stage `
            --output "dist/${{ matrix.asset }}" `
            forge.exe `
            LICENSE

      - name: Validate Windows archive layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/reproducible_archive.py verify `
            --format zip `
            --source dist/stage `
            --output "dist/${{ matrix.asset }}" `
            forge.exe `
            LICENSE
          python packaging/reproducible_archive.py create `
            --format zip `
            --source dist/stage `
            --output "dist/${{ matrix.asset }}.reproduced" `
            forge.exe `
            LICENSE
          $digest = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset }}").Hash
          $reproducedDigest = (
            Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset }}.reproduced"
          ).Hash
          if ($digest -ne $reproducedDigest) {
            throw "Windows archive is not byte-for-byte reproducible"
          }
          Remove-Item "dist/${{ matrix.asset }}.reproduced"

          $validationDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          try {
            Expand-Archive -Path "dist/${{ matrix.asset }}" -DestinationPath $validationDir
            $actual = @(
              Get-ChildItem -Path $validationDir -File -Recurse |
                ForEach-Object {
                  [IO.Path]::GetRelativePath($validationDir, $_.FullName).Replace('\', '/')
                } |
                Sort-Object
            )
            $expected = @('forge.exe', 'LICENSE') | Sort-Object
            if (($actual -join "`n") -ne ($expected -join "`n")) {
              throw "Unexpected Windows archive layout: $($actual -join ', ')"
            }
            $actualVersion = & (Join-Path $validationDir "forge.exe") --version
            if ($actualVersion -ne "forge $($env:RELEASE_TAG.TrimStart('v'))") {
              throw "Unexpected forge.exe version: $actualVersion"
            }
          } finally {
            Remove-Item -Path $validationDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise Windows installer against release fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $releaseDir = Join-Path $smokeDir "release"
          $binDir = Join-Path $smokeDir "bin"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "dist/${{ matrix.asset }}" $releaseDir
          $archive = Join-Path $releaseDir "${{ matrix.asset }}"
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content `
            -Path (Join-Path $releaseDir "SHA256SUMS") `
            -Value "$digest  ${{ matrix.asset }}" `
            -Encoding ascii

          $portProbe = [Net.Sockets.TcpListener]::new(
            [Net.IPAddress]::Loopback,
            0
          )
          $portProbe.Start()
          $port = ([Net.IPEndPoint]$portProbe.LocalEndpoint).Port
          $portProbe.Stop()
          $python = (Get-Command python).Source
          $server = Start-Process `
            -FilePath $python `
            -ArgumentList @(
              "-m",
              "http.server",
              "$port",
              "--bind",
              "127.0.0.1",
              "--directory",
              $releaseDir
            ) `
            -PassThru `
            -WindowStyle Hidden

          $previousBaseUrl = $env:FORGE_RELEASE_BASE_URL
          $previousBinDir = $env:FORGE_BIN_DIR
          try {
            $baseUrl = "http://127.0.0.1:$port"
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                Invoke-WebRequest `
                  -Uri "$baseUrl/SHA256SUMS" `
                  -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw "Local release fixture did not become ready"
            }

            $env:FORGE_RELEASE_BASE_URL = $baseUrl
            $env:FORGE_BIN_DIR = $binDir
            & ./installer/install.ps1
            $actualVersion = & (Join-Path $binDir "forge.exe") --version
            if ($actualVersion -ne "forge $($env:RELEASE_TAG.TrimStart('v'))") {
              throw "Installed forge.exe has unexpected version: $actualVersion"
            }
          } finally {
            $env:FORGE_RELEASE_BASE_URL = $previousBaseUrl
            $env:FORGE_BIN_DIR = $previousBinDir
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
      SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.release_epoch }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Verify pinned source and OIDC identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forge-*
          path: release
          merge-multiple: true

      - name: Install pinned SBOM generator
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate CycloneDX SBOM and checksums
        shell: bash
        run: |
          cargo cyclonedx --all --format json --spec-version 1.5 --override-filename forge-core.cdx
          mv forge-core.cdx.json release/forge-core.cdx.json
          install -m 0755 installer/install.sh release/install.sh
          install -m 0644 installer/install.ps1 release/install.ps1
          cd release
          LC_ALL=C sha256sum \
            forge-*.tar.gz \
            forge-*.zip \
            forge-core.cdx.json \
            install.sh \
            install.ps1 \
            >SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest with GitHub OIDC
        shell: bash
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          }
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
