name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Build release binary
        run: cargo build --release --all-features --locked

      - name: Run bounded production smoke
        run: bash packaging/smoke-production.sh target/release/forge

      - name: Run off-host backup smoke
        run: bash packaging/smoke-offhost-backup.sh target/release/forge

      - name: Verify distributable crate
        run: cargo package --locked

  supply-chain:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned security tools
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" |
            sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository tree for secrets
        run: gitleaks dir --redact=100 --no-banner --no-color .

      - name: Scan repository history for secrets
        run: gitleaks git --redact=100 --no-banner --no-color --log-opts="--all" .

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check advisories licenses bans sources
