[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-sdk"
version = "0.6.0"
description = "Foundry Python SDK scaffold for async workflow orchestration."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["foundry_sdk", "forge_sdk"] # foundry-brand-allow: legacy-compat
